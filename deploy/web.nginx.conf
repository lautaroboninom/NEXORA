server {
    listen 80 default_server;
    server_name _;

    # Frontend static files
    root /usr/share/nginx/html;
    index index.html;

    # Cache immutable assets
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Django collected static files (mounted at /static)
    location /static/ {
        alias /static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # API proxy to Django
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Mismos plazos que producción: emitir un remito puede pasarse del
        # minuto y el 504 del default deja al operador reintentando algo que
        # en Bejerman ya salió.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Single Page App routing
    location / {
        try_files $uri /index.html;
    }

    # Reasonable request size for uploads
    client_max_body_size 50m;

    # Basic gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

